name: Build and Test Iraq Probashi Help

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Remove lock file and install fresh
      run: |
        rm -f package-lock.json
        npm install --legacy-peer-deps

    - name: Run build check
      run: npm run build
